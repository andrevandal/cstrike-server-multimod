// Executed on every map load. Sets the classic baseline so per-mode cvars never leak into the next map.
// Mode overrides live in addons/amxmodx/configs/maps/prefix_<prefix>.cfg (run by AMXX after this file).
// Secrets, hostname and FastDL URL are rendered from env vars into env.cfg by entrypoint.sh.

exec env.cfg

// Downloads
sv_allowdownload 1
sv_allowupload 1
sv_send_resources 1

// Network rates
sv_minrate 25000
sv_maxrate 100000
sv_minupdaterate 30
sv_maxupdaterate 102

// Classic baseline
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_tkpunish 0
mp_c4timer 35
mp_roundtime 2
mp_freezetime 2
mp_buytime 0.25
mp_startmoney 800
mp_timelimit 20
mp_maxrounds 0
mp_flashlight 1
mp_footsteps 1
mp_round_infinite 0
mp_autobunnyhopping 0

// Voice
sv_voiceenable 1
sv_alltalk 1

// Bans (symlinked to /state by entrypoint.sh)
exec listip.cfg
exec banned.cfg
