// Executed on every map load. Sets the Deathmatch baseline; cs_ and de_ restore classic rules.
// Map-specific config lives in addons/amxmodx/configs/maps/.
// Secrets, hostname and FastDL URL are rendered from env vars into env.cfg by entrypoint.sh.

exec env.cfg

// Downloads
sv_allowdownload 1
sv_allowupload 1
sv_send_resources 1

// Network rates
sv_minrate 25000
sv_maxrate 100000
sv_minupdaterate 30
sv_maxupdaterate 102

// Deathmatch baseline
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_tkpunish 0
mp_c4timer 35
mp_roundtime 2
mp_freezetime 0
mp_buytime 9999
mp_startmoney 16000
mp_maxmoney 16000
mp_timelimit 20
mp_maxrounds 0
mp_flashlight 1
mp_footsteps 1
mp_forcerespawn 1.5
mp_respawn_immunitytime 2
mp_round_infinite 1
mp_free_armor 2
mp_buy_anywhere 1
mp_refill_bpammo_weapons 2
mp_auto_reload_weapons 1
mp_item_staytime 20
mp_freeforall 0
mp_autobunnyhopping 0

// Voice
sv_voiceenable 1
sv_alltalk 1

// Bans (symlinked to /state by entrypoint.sh)
exec listip.cfg
exec banned.cfg
