# ========================================================
# 		REUNION CONFIGURATION
# ========================================================

# ========================================================
# 		AUTHID MANAGEMENT
# ========================================================

# ClientID types (for cid_* options)
#  1: Real (or generated by HW) steam (STEAM_xx:xx:xx)
#  2: Real (or generated by HW) valve (VALVE_xx:xx:xx)
#  3: STEAM_ by IP
#  4: VALVE_ by IP
#  5: Deprecated - client will be rejected
#  6: reserved for future use
#  7: HLTV
#  8: STEAM_ID_LAN
#  9: STEAM_ID_PENDING
#  10: VALVE_ID_LAN
#  11: VALVE_ID_PENDING
#  12: STEAM_666:88:666

### AUTH CONTROL ###

# For Legit Steam clients (default is real STEAM_xx:xx:xx [1])
cid_Steam = 1

# Client recognized as pending when they sucessfully authorized, but did not get steam id
cid_SteamPending = 9

# for HLTV
cid_HLTV = 7

# for p.47 clients that do not support unique id generation (allow non-steam protocol 47)
cid_NoSteam47 = 4

# for p.48 clients that do not support unique id generation (allow non-steam protocol 48)
cid_NoSteam48 = 4

# For players having revEmu ( >= 9.74) on client-side:
cid_RevEmu = 1

# For players having RevEmu 2013 on client-side:
cid_RevEmu2013 = 1

# For players having SteamClient 2009 / revEmu > 9.82 on client-side:
cid_SC2009 = 1

# For players having old revEmu on client-side:
cid_OldRevEmu = 1

# For players having hCupa's SteamEmu on client-side:
cid_SteamEmu = 1

# For players having AVSMP (Cracked Steam) on client-side:
cid_AVSMP = 1

# For SETTI ServerScanner
cid_Setti = 3

# For SXEI Clients
cid_SXEI = 1


### AUTH SETTINGS ###

# Authorization protocols version.
#	1: DProto (deprecated)
#	2: Reunion 2015-2018
#	3: Reunion new (recommended)
AuthVersion = 3

# SteamIdHashSalt (string) - set at container startup by entrypoint.sh
SteamIdHashSalt =

SC2009_RevCompatMode = 1
EnableSXEIdGeneration = 0
EnableGenPrefix2 = 0
HLTVExcept_IP = 127.0.0.1


### AUTHID PREFIXES ###

IPGen_Prefix1 = 0
IPGen_Prefix2 = 4
Native_Prefix1 = 0
RevEmu_Prefix1 = 1
RevEmu2013_Prefix1 = 1
SC2009_Prefix1 = 1
OldRevEmu_Prefix1 = 2
SteamEmu_Prefix1 = 3
AVSMP_Prefix1 = 4
Setti_Prefix1 = 5
SXEI_Prefix1 = 6


# ========================================================
# 		SERVER QUERIES MANAGEMENT
# ========================================================

# ServerInfoAnswerType (0/1/2)
# Sets server answer type for query requests
#   0 = New style (Steam) (recommended)
#   1 = Old Style (GoldSource Engine)
#   2 = Hybrid mode - Server is visible anywhere (Steam + non-Steam)
# Default: 2 (hybrid)
ServerInfoAnswerType = 2

# FixBuggedQuery (0 / 1)
# Enable fix for clients with bugged serverbrowser. Prevents hanging on connect.
FixBuggedQuery = 1

# EnableQueryLimiter (0 / 1)
EnableQueryLimiter = 1

# QueryFloodBanLevel (320 - 2048)
QueryFloodBanLevel = 400

# QueryFloodBanTime (0 - 60)
QueryFloodBanTime = 10

[QueryLimiterExceptIP]
#127.0.0.1

AllowSplitPackets = 0
IDClientsLimit = 1

# ========================================================
# 		OTHER STUFF
# ========================================================

LoggingMode = 0
