; ad_manager (MaximusBrood): one message per line, shown every 60-80 s in rotation.
; Colors: !g green, !t team color, !n normal (yellow). ASCII only, max ~120 chars per line.
; Conditions (optional): % map de_dust2 % min_players 2 % max_players 5 % ~message
;   min_players/max_players count humans only.
; Autoresponder: @keyword~answer (answers when a player says the keyword).

!g[Servidor] !nDeathmatch em todos os mapas, menos !tcs_!n e !tde_!n (modo classico).
!g[Servidor] !nNo DM voce renasce com !t$16.000!n e armas caidas viram municao ao pisar.
!g[Servidor] !nDigite !g/sounds!n para ligar ou desligar os sons de killstreak e headshot.
!g[Servidor] !nO servidor mantem !t9 bots!n e os times sempre equilibrados, mesmo com gente entrando.
!g[Servidor] !nDigite !grtv!n para pedir troca de mapa e !gnominate!n para indicar um mapa.
!g[Servidor] !nQuer saber o proximo mapa? Digite !gnextmap!n. Tempo restante: !gtimeleft!n.

@comandos~!g[Servidor] !n/sounds, rtv, nominate, nextmap, timeleft. Admins: /menu.
@ajuda~!g[Servidor] !nComandos: !g/sounds!n, !grtv!n, !gnominate!n, !gnextmap!n, !gtimeleft!n.
