server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    location / {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location = /motd.html {
        alias /etc/nginx/motd/motd.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(bsp|wad|res|mdl|spr|wav|mp3|tga|bmp|txt|zip)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
