services:
  cstrike:
    build: ./server
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD is required}
      SV_PASSWORD: ${SV_PASSWORD:-}
      SERVER_NAME: ${SERVER_NAME:-CS 1.6 Nostalgia | Multi-Mod}
      FASTDL_URL: ${FASTDL_URL:-http://fastdl.vandal.services:8080/}
      START_MAP: ${START_MAP:-de_dust2}
      MAXPLAYERS: ${MAXPLAYERS:-32}
      ADMINS: ${ADMINS:-}
      MODERATORS: ${MODERATORS:-}
      ANTICHEAT_ENABLED: ${ANTICHEAT_ENABLED:-1}
      REUNION_ENABLED: ${REUNION_ENABLED:-1}
      REUNION_SALT: ${REUNION_SALT:-}
    ports:
      - "27015:27015/udp"
    volumes:
      - ./content:/content:ro
      - ./state:/state
      - ./logs:/logs
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  fastdl:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./content:/usr/share/nginx/html:ro
      - ./fastdl/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fastdl/motd.html:/etc/nginx/motd/motd.html:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  backup:
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON_EXPRESSION:-0 4 * * *}
      BACKUP_FILENAME: cs16-state-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: cs16-state-
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./state:/backup/cs-state:ro
      - ./backups:/archive
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
