services:
  content-init:
    build:
      context: .
      dockerfile: init/Dockerfile
    restart: "no"
    volumes:
      - ./content:/content

  cstrike:
    build: ./server
    restart: unless-stopped
    stop_grace_period: 6m
    stdin_open: true
    tty: true
    environment:
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD is required}
      SV_PASSWORD: ${SV_PASSWORD:-}
      SERVER_NAME: ${SERVER_NAME:-CS 1.6 Nostalgia | Multi-Mod}
      FASTDL_URL: ${FASTDL_URL:-http://cstrike.vandal.services:8888/}
      START_MAP: ${START_MAP:-de_dust2}
      MAXPLAYERS: ${MAXPLAYERS:-32}
      ADMINS: ${ADMINS:-STEAM_0:1:26191905}
      MODERATORS: ${MODERATORS:-}
      ANTICHEAT_ENABLED: ${ANTICHEAT_ENABLED:-1}
      REUNION_ENABLED: ${REUNION_ENABLED:-1}
      REUNION_SALT: ${REUNION_SALT:-}
    depends_on:
      content-init:
        condition: service_completed_successfully
    ports:
      - "27015:27015/udp"
    volumes:
      - ./content:/content:ro
      - ./state:/state
      - ./logs:/logs
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  fastdl:
    build: ./fastdl
    restart: unless-stopped
    depends_on:
      content-init:
        condition: service_completed_successfully
    ports:
      - "${FASTDL_PORT:-8888}:80"
    volumes:
      - ./content:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

