name: test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/init

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: server
          load: true
          tags: cstrike-server-multimod-cstrike
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile, unit and integration tests
        run: scripts/test.sh --no-build
